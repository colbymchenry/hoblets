releaseNotes: >
  ### Highlights

  - Fixed mobile boards and chats freezing after connecting to the desktop.

  - Repaired chats that saved GPT-6 Astra under Claude, so they use Codex and
  retain their message history.


  ### Fixes

  - Kept the WebSocket runtime dependency intact in the packaged desktop server.
  Large chat and board join messages now use its supported fallback instead of
  failing after the connection upgrades.

  - Reject invalid Claude/Codex model combinations before creating or sending a
  chat. Desktop chats refresh their provider and model from the saved thread
  when reopened.
