releaseNotes: >
  ### Highlights

  - Mobile boards and chats keep loading when the network cannot establish a
  WebSocket connection.


  ### Fixes

  - Restored HTTP fallback for mobile live updates, including board contents,
  chat history, and incoming replies. Fixed desktop request routing so fallback
  connections reach Socket.IO correctly.

  - Preserved executable permissions on the bundled terminal helper so terminal
  sessions can start in the installed desktop app.
