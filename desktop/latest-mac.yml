releaseNotes: >
  ### Highlights

  - Mobile chats use the AI provider shown in the model picker.


  ### Fixes

  - Restored an existing chat’s saved provider and model before enabling mobile
  sends, even when its live connection is delayed. Choosing a different provider
  starts a new chat, and the server rejects selections that do not match the
  chat’s provider.
